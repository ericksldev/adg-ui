# Angular dev server only. Run from this directory: `docker compose up`
# Optional: copy `compose.env.example` to `compose.env` and run `docker compose --env-file compose.env up`
# Default UI port on the host: 4730 (override with VRETE_UI_PORT).

name: vrete-ui

services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vrete-ui
    restart: "no"
    ports:
      - "${VRETE_UI_PORT:-4730}:${VRETE_UI_PORT:-4730}"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    # `ng` global puede ser otra versión de Angular y romper el compilador; usar la CLI de node_modules.
    command:
      - ./node_modules/.bin/ng
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "${VRETE_UI_PORT:-4730}"
      - --poll
      - "2000"
    volumes:
      - .:/app
      - vrete_ui_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  vrete_ui_node_modules:
    # Existing volume. The Docker volume rename is deferred.
    external: true
    name: adg-ui_adg_ui_node_modules

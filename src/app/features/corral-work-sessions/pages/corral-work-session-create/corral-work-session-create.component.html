<div class="corral-session-create">
  <div class="app-page-header">
    <h2 class="app-page-title mb-0 d-inline-flex align-items-center gap-1">
      {{ 'corralWorkSession.createTitle' | t }}
      <app-info-hint [text]="'corralWorkSession.createSubtitleV3' | t"></app-info-hint>
    </h2>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div class="app-card p-3 mb-3">
    <h3 class="h6">{{ 'corralWorkSession.sectionSession' | t }}</h3>
    <div class="row g-2">
      <div class="col-md-4" *ngIf="isSaasOwner">
        <label class="form-label small">{{ 'users.company' | t }} *</label>
        <select
          class="form-select form-select-sm"
          [(ngModel)]="selectedCompany"
          (ngModelChange)="onCompanyChange($event)"
          [disabled]="loading || saving"
        >
          <option value="">{{ 'paddocks.pickCompany' | t }}</option>
          <option *ngFor="let c of companyRows" [value]="c.uuid_company">{{ c.name }}</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label small">{{ 'animal.fieldRanch' | t }} *</label>
        <select class="form-select form-select-sm" [(ngModel)]="ranchUuid" [disabled]="loading || saving || ranchRows.length === 0">
          <option value="">{{ 'animal.selectRanch' | t }}</option>
          <option *ngFor="let r of ranchRows" [value]="r.uuid_ranch">{{ r.name }}</option>
        </select>
        <p *ngIf="!loading && ranchRows.length === 0" class="text-muted small mb-0 mt-1">
          {{ isSaasOwner && !selectedCompany ? ('paddocks.pickCompany' | t) : ('corralWorkSession.noRanchesAvailable' | t) }}
        </p>
      </div>
      <div class="col-md-4">
        <label class="form-label small">{{ 'corralWorkSession.fieldWorkDate' | t }} *</label>
        <input type="date" class="form-control form-control-sm" [(ngModel)]="workDate" [disabled]="saving" />
      </div>
      <div class="col-md-4">
        <label class="form-label small">{{ 'corralWorkSession.responsiblePerson' | t }}</label>
        <input class="form-control form-control-sm" [(ngModel)]="responsiblePerson" [disabled]="saving" />
      </div>
      <div class="col-12">
        <label class="form-label small">{{ 'corralWorkSession.fieldNotes' | t }}</label>
        <textarea class="form-control form-control-sm" rows="2" [(ngModel)]="notes" [disabled]="saving"></textarea>
      </div>
    </div>
  </div>

  <div class="d-flex gap-2">
    <button type="button" class="btn btn-primary btn-sm" (click)="submit()" [disabled]="saving || loading">
      {{ saving ? ('common.saving' | t) : ('corralWorkSession.saveSession' | t) }}
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="cancel()" [disabled]="saving">
      {{ 'common.cancel' | t }}
    </button>
  </div>
</div>

<div *ngIf="loading" class="text-muted small py-2">{{ 'common.loading' | t }}</div>

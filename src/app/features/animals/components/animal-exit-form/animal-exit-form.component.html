<div class="animal-exit-form" [formGroup]="form">
  <p *ngIf="showLegend" class="text-muted small mb-2">{{ 'animal.exitFormLegend' | t }}</p>
  <div class="row g-2">
    <div class="col-md-6">
      <label class="form-label small mb-1" for="exitType">{{ 'animal.exitType' | t }} *</label>
      <select id="exitType" class="form-select form-select-sm" formControlName="exitType">
        <option *ngFor="let opt of exitTypeOptions" [value]="opt.value">{{ opt.labelKey | t }}</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label small mb-1" for="exitDate">{{ 'animal.exitDate' | t }} *</label>
      <input id="exitDate" class="form-control form-control-sm" type="date" formControlName="exitDate" [max]="maxExitDate" />
    </div>
    <div class="col-md-6">
      <label class="form-label small mb-1" for="exitReason">{{ 'animal.exitReason' | t }}</label>
      <input id="exitReason" class="form-control form-control-sm" type="text" formControlName="reason" />
    </div>
    <div class="col-12">
      <label class="form-label small mb-1" for="exitDescription">{{ 'animal.exitDescription' | t }}</label>
      <textarea id="exitDescription" class="form-control form-control-sm" rows="2" formControlName="description"></textarea>
    </div>
  </div>
</div>

<div class="owner-form border rounded p-3 mb-3 bg-light">
  <h6 class="mb-3">{{ mode === 'edit' ? ('owners.edit' | t) : ('owners.create' | t) }}</h6>
  <div class="row g-2">
    <div class="col-md-6">
      <label class="form-label mb-1" for="owner-form-full-name">{{ 'owners.fullName' | t }} *</label>
      <input
        id="owner-form-full-name"
        class="form-control"
        [(ngModel)]="value.fullName"
        (blur)="markTouched('fullName')"
        [class.is-invalid]="showFullNameError"
      />
      <div class="form-text text-danger mb-0" *ngIf="showFullNameError">
        {{ 'owners.validation.fullNameRequired' | t }}
      </div>
    </div>
    <div class="col-md-6">
      <label class="form-label mb-1" for="owner-form-document">{{ 'owners.documentNumber' | t }}</label>
      <input id="owner-form-document" class="form-control" [(ngModel)]="value.documentNumber" />
    </div>
    <div class="col-md-6">
      <label class="form-label mb-1" for="owner-form-phone">{{ 'owners.phone' | t }}</label>
      <input id="owner-form-phone" class="form-control" [(ngModel)]="value.phoneNumber" />
    </div>
    <div class="col-md-6">
      <label class="form-label mb-1" for="owner-form-email">{{ 'owners.email' | t }}</label>
      <input
        id="owner-form-email"
        class="form-control"
        type="email"
        [(ngModel)]="value.email"
        (blur)="markTouched('email')"
        [class.is-invalid]="showEmailError"
      />
      <div class="form-text text-danger mb-0" *ngIf="showEmailError">
        {{ 'owners.validation.emailInvalid' | t }}
      </div>
    </div>
    <div class="col-12">
      <label class="form-label mb-1" for="owner-form-address">{{ 'owners.address' | t }}</label>
      <input id="owner-form-address" class="form-control" [(ngModel)]="value.address" />
    </div>
    <div class="col-12">
      <label class="form-label mb-1" for="owner-form-description">{{ 'owners.description' | t }}</label>
      <textarea id="owner-form-description" class="form-control" rows="3" [(ngModel)]="value.description"></textarea>
    </div>
  </div>
  <div class="mt-3">
    <button type="button" class="btn btn-primary me-2" (click)="onSubmit()" [disabled]="loading || !isValid">
      {{ submitLabelKey | t }}
    </button>
    <button type="button" class="btn btn-outline-secondary" (click)="onCancel()" [disabled]="loading">
      {{ cancelLabelKey | t }}
    </button>
  </div>
</div>

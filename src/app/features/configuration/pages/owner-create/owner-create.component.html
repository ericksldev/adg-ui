<div class="container-fluid owner-create">
  <div class="app-page-header">
    <h3 class="app-page-title mb-0">{{ 'owners.createTitle' | t }}</h3>
  </div>

  <p class="text-danger" *ngIf="errorMessage">{{ errorMessage }}</p>

  <app-owner-form
    mode="create"
    [loading]="isSaving"
    [value]="formValue"
    [submitLabelKey]="'owners.create'"
    (submitForm)="save($event)"
    (cancelForm)="cancel()"
  ></app-owner-form>
</div>

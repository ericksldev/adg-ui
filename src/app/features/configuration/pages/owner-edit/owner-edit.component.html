<div class="container-fluid owner-edit">
  <div class="app-page-header d-flex flex-wrap align-items-center gap-2">
    <a
      class="btn btn-sm btn-outline-secondary"
      *ngIf="owner"
      [routerLink]="['/configuration/owners', owner.owner_uuid]"
    >{{ 'common.back' | t }}</a>
    <h3 class="app-page-title mb-0">{{ 'owners.editTitle' | t }}</h3>
  </div>

  <p class="text-danger" *ngIf="errorMessage">{{ errorMessage }}</p>
  <div class="text-muted py-3" *ngIf="isLoading">{{ 'common.loading' | t }}</div>

  <app-owner-form
    *ngIf="!isLoading && owner"
    mode="edit"
    [loading]="isSaving"
    [value]="formValue"
    [submitLabelKey]="'owners.update'"
    (submitForm)="save($event)"
    (cancelForm)="cancel()"
  ></app-owner-form>
</div>

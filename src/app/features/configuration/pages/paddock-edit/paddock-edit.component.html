<div class="container-fluid paddock-edit">
  <div class="app-page-header d-flex flex-wrap align-items-center gap-2">
    <a
      class="btn btn-sm btn-outline-secondary"
      *ngIf="paddock"
      [routerLink]="['/configuration/paddocks', paddock.paddock_uuid]"
    >{{ 'common.back' | t }}</a>
    <h3 class="app-page-title mb-0">{{ 'paddocks.editTitle' | t }}</h3>
  </div>

  <p class="text-danger" *ngIf="errorMessage">{{ errorMessage }}</p>
  <div class="text-muted py-3" *ngIf="isLoading">{{ 'common.loading' | t }}</div>

  <app-paddock-form
    *ngIf="!isLoading && paddock"
    mode="edit"
    [loading]="isSaving"
    [value]="formValue"
    [submitLabelKey]="'paddocks.update'"
    (submitForm)="save($event)"
    (cancelForm)="cancel()"
  ></app-paddock-form>
</div>

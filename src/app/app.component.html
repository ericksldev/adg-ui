<div
  class="app-shell"
  [class.app-shell--authenticated]="user != null"
  [ngClass]="{'theme-light': currentTheme === 'light', 'theme-dark': currentTheme === 'dark'}"
>
  <app-navbar
    *ngIf="user != null"
    [isSidebarOpen]="openSidebar"
    (toggleSidebarToParent)="toggleSidebarToParent($event)"
    (themeChanged)="onThemeChange($event)"
  ></app-navbar>

  <div class="app-layout" *ngIf="user != null; else guestLayout">
    <button type="button" class="app-sidebar-backdrop" [class.show]="openSidebar" (click)="openSidebar = false" [attr.aria-label]="'nav.closeSidebar' | t"></button>
    <app-sidebar [classApplied]="openSidebar" (sidebarLinkClicked)="openSidebar = false"></app-sidebar>
    <main class="app-main">
      <app-breadcrumb></app-breadcrumb>
      <div class="app-page-body">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <ng-template #guestLayout>
    <main class="app-main app-main-guest">
      <router-outlet></router-outlet>
    </main>
  </ng-template>
</div>

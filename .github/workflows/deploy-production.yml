name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: vrete-ui-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build and publish static site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # TEMPORARY: remove after comparing these claims with the IAM trust policy.
      - name: Diagnose OIDC token claims (temporary)
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          FIELDS = ("iss", "aud", "sub", "repository")
          MAX_RESPONSE_BYTES = 8192

          def fail(message):
              print(message)
              raise SystemExit(1)

          request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
          request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
          if not request_url or not request_token:
              fail("OIDC request failed: token request configuration is unavailable")

          parts = urlsplit(request_url)
          if parts.scheme != "https":
              fail("OIDC request failed: token request URL is not HTTPS")

          query = dict(parse_qsl(parts.query, keep_blank_values=True))
          query["audience"] = "sts.amazonaws.com"
          url = urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), ""))

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"bearer {request_token}",
                  "Accept": "application/json",
              },
              method="GET",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = getattr(response, "status", None)
                  raw = response.read(MAX_RESPONSE_BYTES + 1)
          except urllib.error.HTTPError as exc:
              fail(f"OIDC request failed: HTTP {exc.code}")
          except Exception:
              fail("OIDC request failed: request could not be completed")

          if status != 200:
              fail(f"OIDC request failed: HTTP {status}")
          if len(raw) > MAX_RESPONSE_BYTES:
              fail("OIDC request failed: response exceeded size limit")

          try:
              body = json.loads(raw.decode("utf-8"))
              token = body.get("value")
              if not isinstance(token, str) or token.count(".") != 2:
                  raise ValueError
              payload_segment = token.split(".", 2)[1]
          except Exception:
              fail("OIDC request failed: response could not be parsed")
          finally:
              raw = b""
              body = None
              token = None
              request_token = None

          padding = "=" * (-len(payload_segment) % 4)
          try:
              payload = json.loads(base64.urlsafe_b64decode(payload_segment + padding))
          except Exception:
              fail("OIDC request failed: payload could not be decoded")
          finally:
              payload_segment = None

          if not isinstance(payload, dict):
              fail("OIDC request failed: payload is not an object")

          print("OIDC claim diagnostics (temporary)")
          for field in FIELDS:
              if field not in payload or payload[field] is None:
                  print(f"{field}: <missing>")
                  continue
              value = payload[field]
              if isinstance(value, str):
                  print(f"{field}: {value if value else '<empty>'}")
              elif isinstance(value, list) and all(isinstance(item, str) for item in value):
                  print(f"{field}: {json.dumps(value, ensure_ascii=True)}")
              else:
                  print(f"{field}: <unsupported type>")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish to S3
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${S3_BUCKET_NAME}" ]; then
            echo "Missing required GitHub secret: S3_BUCKET_NAME"
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          bucket = os.environ["S3_BUCKET_NAME"]
          dist = Path("dist/vrete-ui")
          index_path = dist / "index.html"
          if not index_path.is_file():
              raise SystemExit("Build output not found: dist/vrete-ui/index.html")

          placeholder = "REPLACE_WITH_PRODUCTION_API_URL"
          for path in dist.rglob("*"):
              if path.is_file() and placeholder in path.read_text(encoding="utf-8", errors="ignore"):
                  raise SystemExit(
                      "PRODUCTION_API_URL still contains REPLACE_WITH_PRODUCTION_API_URL. "
                      "Set the production API URL before deploying."
                  )

          hashed_name = re.compile(r"\.[0-9a-f]{8,}\.(?:js|css)$", re.IGNORECASE)
          long_cache = "public, max-age=31536000, immutable"
          revalidate = "public, max-age=0, must-revalidate"
          index_cache = "no-cache, no-store, must-revalidate"
          local_keys = set()

          for path in dist.rglob("*"):
              if not path.is_file():
                  continue
              key = path.relative_to(dist).as_posix()
              local_keys.add(key)
              destination = f"s3://{bucket}/{key}"
              command = ["aws", "s3", "cp", str(path), destination, "--metadata-directive", "REPLACE"]
              if path.name == "index.html":
                  command.extend([
                      "--cache-control", index_cache,
                      "--content-type", "text/html; charset=utf-8",
                  ])
              elif hashed_name.search(path.name):
                  command.extend(["--cache-control", long_cache])
              else:
                  command.extend(["--cache-control", revalidate])
              subprocess.run(command, check=True)

          token = None
          remote_keys = []
          while True:
              command = ["aws", "s3api", "list-objects-v2", "--bucket", bucket, "--output", "json"]
              if token:
                  command.extend(["--continuation-token", token])
              listed = json.loads(subprocess.check_output(command))
              for item in listed.get("Contents", []):
                  remote_keys.append(item["Key"])
              if not listed.get("IsTruncated"):
                  break
              token = listed.get("NextContinuationToken")

          stale = [{"Key": key} for key in remote_keys if key not in local_keys]
          for offset in range(0, len(stale), 1000):
              chunk = stale[offset:offset + 1000]
              subprocess.run(
                  [
                      "aws", "s3api", "delete-objects",
                      "--bucket", bucket,
                      "--delete", json.dumps({"Objects": chunk, "Quiet": True}),
                  ],
                  check=True,
              )
          PY

      - name: Configure CloudFront SPA fallback
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            echo "Missing required GitHub secret: CLOUDFRONT_DISTRIBUTION_ID"
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import subprocess

          distribution_id = os.environ["CLOUDFRONT_DISTRIBUTION_ID"]
          payload = json.loads(subprocess.check_output([
              "aws", "cloudfront", "get-distribution-config",
              "--id", distribution_id,
              "--output", "json",
          ]))
          config = payload["DistributionConfig"]
          desired = [
              {
                  "ErrorCode": 403,
                  "ResponsePagePath": "/index.html",
                  "ResponseCode": "200",
                  "ErrorCachingMinTTL": 0,
              },
              {
                  "ErrorCode": 404,
                  "ResponsePagePath": "/index.html",
                  "ResponseCode": "200",
                  "ErrorCachingMinTTL": 0,
              },
          ]
          current_items = (config.get("CustomErrorResponses") or {}).get("Items") or []
          preserved = [item for item in current_items if item.get("ErrorCode") not in (403, 404)]
          merged = preserved + desired

          def signature(items):
              return sorted(
                  (
                      item.get("ErrorCode"),
                      item.get("ResponsePagePath"),
                      str(item.get("ResponseCode")),
                      item.get("ErrorCachingMinTTL"),
                  )
                  for item in items
              )

          if signature(current_items) == signature(merged):
              print("CloudFront already returns /index.html with status 200 for 403 and 404.")
              raise SystemExit(0)

          config["CustomErrorResponses"] = {"Quantity": len(merged), "Items": merged}
          config_path = "distribution-config.json"
          with open(config_path, "w", encoding="utf-8") as handle:
              json.dump(config, handle)
          subprocess.run(
              [
                  "aws", "cloudfront", "update-distribution",
                  "--id", distribution_id,
                  "--if-match", payload["ETag"],
                  "--distribution-config", f"file://{config_path}",
              ],
              check=True,
          )
          os.remove(config_path)
          PY

      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
